[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
  https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/heads/master.zip
build_flags =
  -DUSER_SETUP_LOADED=1
  ; --- display driver: ILI9341 default. For CYD2USB/ST7789 variants: replace with -DST7789_DRIVER=1 and add -DTFT_INVERSION_ON
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240 -DTFT_HEIGHT=320
  -DTFT_MISO=12 -DTFT_MOSI=13 -DTFT_SCLK=14 -DTFT_CS=15 -DTFT_DC=2 -DTFT_RST=-1
  -DTFT_BL=21 -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1 -DLOAD_FONT2=1 -DLOAD_FONT4=1 -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=55000000 -DSPI_READ_FREQUENCY=20000000 -DSPI_TOUCH_FREQUENCY=2500000
